[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uthyagent"
version = "0.1.0"
description = "A local-first Linux desktop computer-use agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Uthuman Moody" }]
keywords = ["linux", "desktop", "automation", "accessibility", "agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
# PyGObject is normally installed from distribution packages because it needs
# the system GTK development libraries; pip installation is not recommended.
http = []
test = ["pytest>=8.0", "ruff>=0.11"]

[project.scripts]
uthyagent = "uthyagent.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uthyagent = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
